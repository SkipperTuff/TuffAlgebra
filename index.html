<script>
window.addEventListener("load", () => {

  /* OPEN GAMES */
  document.querySelectorAll("#games a").forEach(link => {
    link.addEventListener("click", e => {
      e.preventDefault();
      window.open(link.href, "_blank");
    });
  });

  /* SETTINGS */
  function particlesEnabled() {
    const p = localStorage.getItem("particles");
    return p === null || p === "true";
  }

  /* SEARCH */
  const input = document.querySelector('.search input');
  const cards = document.querySelectorAll('#games .game-card');

  if (input) {
    input.addEventListener('input', () => {
      const searchTerm = input.value.toLowerCase();
      cards.forEach(card => {
        const name = card.dataset.name.toLowerCase();
        card.style.display = name.includes(searchTerm) ? "" : "none";
      });
    });
  }

  /* FAVORITES */
  let favorites = JSON.parse(localStorage.getItem("favorites")) || [];

  document.querySelectorAll(".game-card").forEach(card => {
    const name = card.dataset.name;
    const btn = card.querySelector(".fav-btn");
    if (btn && favorites.includes(name)) btn.classList.add("active");
  });

  document.querySelectorAll(".fav-btn").forEach(btn => {
    btn.addEventListener("click", (e) => {
      e.stopPropagation();
      const card = btn.closest(".game-card");
      if (!card) return;
      const name = card.dataset.name;
      if (!name) return;

      if (favorites.includes(name)) {
        favorites = favorites.filter(f => f !== name);
        btn.classList.remove("active");
      } else {
        favorites.push(name);
        btn.classList.add("active");
      }

      localStorage.setItem("favorites", JSON.stringify(favorites));
    });
  });

  /* PARTICLES */
  const canvas = document.getElementById("bgCanvas");
  const ctx = canvas.getContext("2d");

  canvas.style.pointerEvents = "none";

  function resize() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
  }
  resize();

  let particles = [];

  function spawnParticles() {
    particles = [];
    for (let i = 0; i < 90; i++) {
      particles.push({
        x: Math.random() * window.innerWidth,
        y: Math.random() * window.innerHeight,
        vx: (Math.random() - 0.5) * 0.7,
        vy: (Math.random() - 0.5) * 0.7
      });
    }
  }

  spawnParticles();

  /* MOUSE TRACKING */
  let mouseX = -9999;
  let mouseY = -9999;

  window.addEventListener("mousemove", (e) => {
    mouseX = e.clientX;
    mouseY = e.clientY;
  });

  window.addEventListener("mouseleave", () => {
    mouseX = -9999;
    mouseY = -9999;
  });

  /* ANIMATE */
  let hue = 0;

  function animate() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    hue = (hue + 0.15) % 360;

    if (particlesEnabled()) {

      particles.forEach(p => {

        const dx = p.x - mouseX;
        const dy = p.y - mouseY;
        const dist = Math.sqrt(dx * dx + dy * dy);
        const repelRadius = 100;

        if (dist < repelRadius && dist > 0) {
          const force = (repelRadius - dist) / repelRadius;
          p.vx += (dx / dist) * force * 0.6;
          p.vy += (dy / dist) * force * 0.6;
        }

        const speed = Math.sqrt(p.vx * p.vx + p.vy * p.vy);
        const maxSpeed = 3;
        if (speed > maxSpeed) {
          p.vx = (p.vx / speed) * maxSpeed;
          p.vy = (p.vy / speed) * maxSpeed;
        }

        p.vx *= 0.999;
        p.vy *= 0.999;

        p.x += p.vx;
        p.y += p.vy;

        if (p.x < 0 || p.x > canvas.width) p.vx *= -1;
        if (p.y < 0 || p.y > canvas.height) p.vy *= -1;

        ctx.fillStyle = `hsl(${hue}, 100%, 55%)`;
        ctx.shadowColor = `hsl(${hue}, 100%, 55%)`;
        ctx.shadowBlur = 8;
        ctx.fillRect(p.x, p.y, 2, 2);
      });

      for (let i = 0; i < particles.length; i++) {
        for (let j = i + 1; j < particles.length; j++) {
          let dx = particles[i].x - particles[j].x;
          let dy = particles[i].y - particles[j].y;
          let dist = Math.sqrt(dx * dx + dy * dy);

          if (dist < 120) {
            ctx.strokeStyle = `hsla(${hue}, 100%, 55%, 0.25)`;
            ctx.beginPath();
            ctx.moveTo(particles[i].x, particles[i].y);
            ctx.lineTo(particles[j].x, particles[j].y);
            ctx.stroke();
          }
        }
      }
    }

    requestAnimationFrame(animate);
  }

  animate();

  window.addEventListener("resize", () => {
    resize();
    spawnParticles();
  });

});
</script>
