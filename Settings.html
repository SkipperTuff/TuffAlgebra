<!DOCTYPE html>
<html>
<head>
  <title>Settings</title>

  <style>
    body {
      background: #0b0b0b;
      color: white;
      font-family: Arial;
      text-align: center;
    }

    .sidebar {
      position: fixed;
      left: 0;
      top: 0;
      width: 150px;
      height: 100%;
      background: #111;
      padding: 10px;
    }

    .sidebar a {
      display: block;
      color: white;
      text-decoration: none;
      margin: 10px 0;
    }

    .section {
      margin: 40px auto;
      width: 400px;
      border-top: 1px dashed #555;
      padding-top: 20px;
    }

    input, select {
      padding: 6px;
      margin: 5px;
      background: #111;
      color: white;
      border: 1px solid #333;
    }

    button {
      background: #222;
      color: white;
      border: none;
      padding: 8px 12px;
      cursor: pointer;
    }

    button:hover {
      background: #333;
    }

    input[type="range"] {
      width: 200px;
    }
  </style>
</head>

<body>

<!-- SIDEBAR -->
<div class="sidebar">
  <a href="index.html">Home</a>
  <a href="Settings.html">Settings</a>
  <a href="Movies.html">Movies</a>
  <a href="Proxy.html">Proxy</a>
</div>

<h1>Settings</h1>

<!-- BACKGROUND IMAGE -->
<div class="section">
  <h2>Background Image</h2>

  <select id="bgSelect">
    <option value="">Default</option>
    <option value="space">Space</option>
    <option value="matrix">Matrix</option>
  </select>

  <br>

  <input id="bgURL" placeholder="Custom image URL">
  <button onclick="saveBG()">Save</button>
</div>

<!-- BACKGROUND COLOR -->
<div class="section">
  <h2>Background Color</h2>

  <input type="color" id="bgColor">
  <button onclick="saveColor()">Save</button>
</div>

<!-- PARTICLES -->
<div class="section">
  <h2>Particles</h2>
  <label>
    <input type="checkbox" id="particles"> Enable Particles
  </label>
  <br>
  <button onclick="saveParticles()">Save</button>
</div>

<!-- SITE -->
<div class="section">
  <h2>Site</h2>

  <label><input type="checkbox" id="darkMode"> Dark Mode</label><br>

  <button onclick="saveSite()">Save</button>
</div>

<!-- VOLUME -->
<div class="section">
  <h2>Volume</h2>

  <input type="range" min="0" max="100" id="volume">
  <br>
  <button onclick="saveVolume()">Save</button>
</div>

<!-- ABOUT BLANK -->
<div class="section">
  <h2>About:Blank</h2>

  <button onclick="openBlank()">Open</button>
</div>

<!-- CREDITS -->
<div class="section">
  <h2>Credits</h2>
  <p>Website by MW</p>
</div>

<script>

/* ===== BACKGROUND IMAGE ===== */
function saveBG() {
  const url = document.getElementById("bgURL").value;
  const preset = document.getElementById("bgSelect").value;

  if (url) {
    localStorage.setItem("bg", url);
  } else if (preset === "space") {
    localStorage.setItem("bg", "https://picsum.photos/1920/1080?random=1");
  } else if (preset === "matrix") {
    localStorage.setItem("bg", "https://picsum.photos/1920/1080?random=2");
  } else {
    localStorage.removeItem("bg");
  }

  alert("Saved!");
}

/* ===== BACKGROUND COLOR ===== */
function saveColor() {
  const color = document.getElementById("bgColor").value;
  localStorage.setItem("bgColor", color);
  alert("Saved!");
}

/* ===== PARTICLES ===== */
function saveParticles() {
  const enabled = document.getElementById("particles").checked;
  localStorage.setItem("particles", enabled);
  alert("Saved!");
}

/* ===== SITE SETTINGS ===== */
function saveSite() {
  const dark = document.getElementById("darkMode").checked;
  localStorage.setItem("darkMode", dark);
  alert("Saved!");
}

/* ===== VOLUME ===== */
function saveVolume() {
  localStorage.setItem("volume", document.getElementById("volume").value);
  alert("Saved!");
}

/* ===== ABOUT BLANK ===== */
function openBlank() {
  const win = window.open();
  win.document.write(`
    <iframe src="${location.origin}" 
    style="width:100%;height:100%;border:none;"></iframe>
  `);
}

/* ===== LOAD SETTINGS ===== */
window.onload = () => {

  // particles (default ON)
  const particles = localStorage.getItem("particles");
  document.getElementById("particles").checked =
    particles === null || particles === "true";

  // dark mode
  document.getElementById("darkMode").checked =
    localStorage.getItem("darkMode") === "true";

  // volume
  document.getElementById("volume").value =
    localStorage.getItem("volume") || 50;

  // color
  const savedColor = localStorage.getItem("bgColor");
  if (savedColor) {
    document.getElementById("bgColor").value = savedColor;
  }
};

</script>

</body>
</html>
